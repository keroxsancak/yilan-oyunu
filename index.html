<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Yılan Oyunu</title>
    <style>
        /* CSS TASARIM AYARLARI */
        body {
            background-color: #222;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .game-container {
            text-align: center;
            max-width: 100%;
        }

        h1 {
            margin: 5px 0;
            color: #4CAF50;
            font-size: 28px;
        }

        .score-box {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        canvas {
            background-color: #111;
            border: 4px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
            display: block;
            margin: 0 auto;
            max-width: 90vw;
            max-height: 90vw;
        }

        /* TELEFON İÇİN DOKUNMATİK BUTONLAR */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: manipulation;
            box-shadow: 0 4px #2E7D32;
        }

        .btn:active {
            background-color: #388E3C;
            box-shadow: 0 2px #2E7D32;
            transform: translateY(2px);
        }

        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Yılan Oyunu</h1>
        <div class="score-box">Skor: <span id="score">0</span></div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button class="btn up" id="btnUp">▲</button>
            <button class="btn left" id="btnLeft">◀</button>
            <button class="btn down" id="btnDown">▼</button>
            <button class="btn right" id="btnRight">▶</button>
        </div>
    </div>

    <script>
        // JAVASCRIPT OYUN MANTIĞI
        window.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");

            const box = 20;

            let snake = [];
            snake[0] = { x: 10 * box, y: 10 * box };

            let food = {
                x: Math.floor(Math.random() * 20) * box,
                y: Math.floor(Math.random() * 20) * box
            };

            let score = 0;
            let d = "";
            
            // Hız Ayarları (Yavaş başlayıp hızlanma mekanizması)
            let currentSpeed = 220; // İlk hız (Yavaş)
            let minSpeed = 60;      // Maksimum hız sınırı
            let speedStep = 10;     // Her yemdeki hızlanma miktarı
            let gameTimeout;

            // 1. KLAVYE KONTROLLERİ (Bilgisayar)
            document.addEventListener("keydown", direction);
            function direction(event) {
                if (event.keyCode == 37 && d != "RIGHT") d = "LEFT";
                else if (event.keyCode == 38 && d != "DOWN") d = "UP";
                else if (event.keyCode == 39 && d != "LEFT") d = "RIGHT";
                else if (event.keyCode == 40 && d != "UP") d = "DOWN";
            }

            // 2. DOKUNMATİK KONTROLLER (Telefon)
            document.getElementById("btnLeft").addEventListener("click", () => { if(d != "RIGHT") d = "LEFT"; });
            document.getElementById("btnUp").addEventListener("click", () => { if(d != "DOWN") d = "UP"; });
            document.getElementById("btnRight").addEventListener("click", () => { if(d != "LEFT") d = "RIGHT"; });
            document.getElementById("btnDown").addEventListener("click", () => { if(d != "UP") d = "DOWN"; });

            // Çarpışma Testi
            function collision(head, array) {
                for (let i = 0; i < array.length; i++) {
                    if (head.x == array[i].x && head.y == array[i].y) return true;
                }
                return false;
            }

            // Çizim ve Güncelleme Döngüsü
            function gameLoop() {
                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Yılanı Çiz
                for (let i = 0; i < snake.length; i++) {
                    ctx.fillStyle = (i == 0) ? "#4CAF50" : "#81C784";
                    ctx.fillRect(snake[i].x, snake[i].y, box, box);
                    ctx.strokeStyle = "#111";
                    ctx.strokeRect(snake[i].x, snake[i].y, box, box);
                }

                // Yemi Çiz
                ctx.fillStyle = "#FF5722";
                ctx.fillRect(food.x, food.y, box, box);

                let snakeX = snake[0].x;
                let snakeY = snake[0].y;

                if (d == "LEFT") snakeX -= box;
                if (d == "UP") snakeY -= box;
                if (d == "RIGHT") snakeX += box;
                if (d == "DOWN") snakeY += box;

                // Yem yeme durumu
                if (snakeX == food.x && snakeY == food.y) {
                    score++;
                    document.getElementById("score").innerText = score;
                    
                    // Yılanı hızlandır
                    if (currentSpeed > minSpeed) {
                        currentSpeed -= speedStep;
                    }

                    food = {
                        x: Math.floor(Math.random() * 20) * box,
                        y: Math.floor(Math.random() * 20) * box
                    };
                } else {
                    snake.pop();
                }

                let newHead = { x: snakeX, y: snakeY };

                // Duvar veya kuyruk çarpma kontrolü
                if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                    clearTimeout(gameTimeout);
                    alert("Oyun Bitti! Skorun: " + score);
                    location.reload(); // Yeniden başlat
                    return;
                }

                snake.unshift(newHead);

                // Dinamik hıza göre bir sonraki kareyi tetikle
                gameTimeout = setTimeout(gameLoop, currentSpeed);
            }

            // Oyunu başlat
            gameLoop();
        });
    </script>
</body>
</html>
